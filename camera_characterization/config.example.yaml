# Example cassa-camchar configuration. Copy, edit, and pass with --config.
# Only the keys you want to override need to be present.

sensor:
  image_size: [500, 500]
  max_adu: 65535
  base_bias_adu: 500.0

capture:                       # the sweep grid (also used by the simulator)
  driver_gains: [0, 50, 100, 150, 200]
  exposure_min_s: 0.1
  exposure_max_s: 12.0
  exposure_steps: 20
  flat_electrons_per_s: 5000.0
  temperatures_c: [-20, -15, -10, -5, 0, 5, 10, 15, 20]
  dark_temp_exposure_s: 300.0
  linearity_temp_c: 0.0
  linearity_exposures_s: [10, 30, 60, 120, 300, 600]

analysis:
  ptc_linear_lo: 0.1           # PTC linear-fit region as a fraction of max signal
  ptc_linear_hi: 0.7
  roi_fraction: 0.5            # central ROI side fraction for robust statistics
  sigma_clip: 5.0              # reject hot / telegraph pixels
  wavelength_min_nm: 350.0
  wavelength_max_nm: 1000.0
  wavelength_points: 500

paths:
  data_dir: ./data
  out_dir: ./camchar_output
