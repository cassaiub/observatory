name: CI

# Two things are checked, and the split matters:
#   * `test` runs the suite with no network, because the pipeline is meant to
#     work from a laptop away from the university and a suite that quietly
#     depends on VizieR being up is not testing that.
#   * `install` runs the actual one-command installation from a clean checkout,
#     because "clone and run one command" is a claim that has to be exercised
#     rather than asserted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test (offline)
        run: python -m pytest -m "not network" -q

      - name: Environment report
        if: always()
        run: python -m cassa_photometry.doctor --no-network || true

  install:
    # The headline promise: a fresh clone, one command, a working pipeline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ./install.sh
        run: ./install.sh --venv --no-doctor

      - name: The installation must be able to solve a plate
        run: |
          .venv/bin/python -m cassa_photometry.doctor --no-network

      - name: Generate simulated data and reduce it
        run: |
          .venv/bin/cassa-simulate --preset tiny --out sim
          .venv/bin/cassa-calibrate -i sim/raw -o sim/work/phase1 --instrument cassa8
          test -n "$(ls sim/work/phase1)"
