# Reference Astrometry.net configuration template.
#
# The pipeline does NOT edit this file. At run time, WCSSolver generates a
# temporary config pointing at the resolved index directory (see the
# CASSA_ASTROMETRY_INDEX environment variable or phase2.astrometry_index_dir).
#
# To use solve-field manually, copy this file and set the add_path below to the
# directory holding your downloaded index-*.fits files.

add_path /path/to/astrometry_data
autoindex
inparallel
